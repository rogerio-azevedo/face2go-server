version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - npm install -g pnpm@11.24.0
  build:
    commands:
      - echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}" > deploy-commit.txt
      - chmod +x scripts/eb-build.sh
      - ./scripts/eb-build.sh .

artifacts:
  files:
    - '**/*'
